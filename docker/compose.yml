name: adorepobck
services:
  backup:
    container_name: adorepobck
    image: adorepobck:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DEVOPS_ORG_URL
      - DEVOPS_PAT
      - RETENTION_DAYS=1
      - DRY_RUN=false
      - WIKI=true
      - NOCOMPRESS=true
      - BACKLOG=false
      - VERBOSE=false
    volumes:
      - ../../backups:/data

  backlog:
    container_name: adorepobck-backlog
    image: adorepobck:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DEVOPS_ORG_URL
      - DEVOPS_PAT
      - RETENTION_DAYS=1
      - DRY_RUN=false
      - WIKI=false
      - NOCOMPRESS=true
      - BACKLOG=true
      - SKIP_REPOS=true
      - VERBOSE=false
    volumes:
      - ../../backups:/data

